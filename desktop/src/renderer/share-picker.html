<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; connect-src 'none'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Grok Bot</title>
  <link rel="stylesheet" href="share-picker.css">
</head>
<body>
  <div id="panel">
    <header id="head">
      <span id="title"></span>
      <span id="hint"></span>

    <p id="empty" hidden></p>

      <button id="send" type="button"></button>
    </footer>
  </div>
  <script type="module" src="share-picker.js"></script>
</body>
</html>
